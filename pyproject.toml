[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noise-monitor"
version = "0.1.0"
description = "Real-time calibrated spectrogram and dBA sound level meter for Raspberry Pi 5 + miniDSP UMIK-1"
# 3.11 for tomllib (Raspberry Pi OS Bookworm ships 3.11).
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
# The GUI. On Raspberry Pi OS install python3-pyqtgraph and python3-pyqt5 from
# apt instead (see README) -- these are the pip equivalents for desktop
# development. pyqtgraph works with either Qt binding; PySide6 has the better
# wheel coverage on current Pythons.
gui = [
    "pyqtgraph>=0.13",
    "PySide6>=6.5",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
noise-monitor = "noise_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["noise_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
